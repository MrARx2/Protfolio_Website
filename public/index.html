    <!-- Restore the saved theme before the page paints. Retired themes use Ice. -->
    <script>
      (function () {
        var theme = "ice";
        try {
          var savedTheme = localStorage.getItem("portfolio-theme");
          if (savedTheme === "ice" || savedTheme === "amber") theme = savedTheme;
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "ice" ? "#071015" : "#090a0b";
        document.querySelectorAll('[data-theme-icon]').forEach(function (icon) {
          icon.href = icon.getAttribute('data-icon-' + theme);
        });
      })();
    </script>
